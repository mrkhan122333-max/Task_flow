# ---------------------------------------------------------------------------
#  Cosmic Info Solutions — Task Management
#  Nginx reverse proxy: tasks.cosmicinfosolutions.com -> app:4321
#
#  TLS: obtain the certificate once with
#      docker run --rm -v $(pwd)/deploy/certbot/conf:/etc/letsencrypt \
#        -v $(pwd)/deploy/certbot/www:/var/www/certbot \
#        certbot/certbot certonly --webroot -w /var/www/certbot \
#        -d tasks.cosmicinfosolutions.com --agree-tos -m <email> --no-eff-email
#
#  Every request forwards the original scheme and client IP, which the app
#  needs for correct HSTS, secure cookies and login rate limiting.
# ---------------------------------------------------------------------------

# Plain HTTP is only used for the ACME challenge and to redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tasks.cosmicinfosolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tasks.cosmicinfosolutions.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tasks.cosmicinfosolutions.com;

    # Docker's embedded DNS resolver, so `app` is looked up per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/tasks.cosmicinfosolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.cosmicinfosolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ----------------------------------------------------
    # HSTS is also set by the app; it is repeated here so it is present even on
    # error responses served by Nginx itself.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;
    server_tokens off;

    # --- Upload ceiling ------------------------------------------------------
    # Keep in sync with MAX_UPLOAD_MB in .env.
    client_max_body_size 25m;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Proxy to the Node process ------------------------------------------
    # `proxy_pass` with a variable plus the embedded Docker resolver makes Nginx
    # re-resolve the `app` container on every request instead of caching the IP
    # at startup. Without this, restarting the app container (which usually gets
    # a new address) would 502 until Nginx was manually reloaded.
    location / {
        set $upstream http://app:4321;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # The SPA is hash-routed, so a miss can safely fall through to the app.
        proxy_redirect off;
    }

    # Long-lived assets. The app itself sets cache headers for static files.
    # add_header does not inherit into a block that declares its own, so the
    # security headers are repeated here rather than silently lost.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        set $upstream http://app:4321;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        expires 7d;
        add_header Cache-Control           "public, max-age=604800" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header Referrer-Policy         "no-referrer" always;
    }
}
