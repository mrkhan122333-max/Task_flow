{% extends "base.html" %}
{% block title %}Join {{ invite.project.name }} - TaskFlow{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-title"><span class="brand-mark">◆</span> TaskFlow</div>
        <div class="auth-subtitle">
            You've been invited to join <strong>{{ invite.project.name }}</strong>
            as {{ invite.role }}. Set a password to finish joining.
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" type="text" name="name" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" value="{{ invite.email }}" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm password</label>
                <input class="form-input" type="password" name="confirm_password" required minlength="6">
            </div>
            <button class="btn" type="submit">Set password &amp; join</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
