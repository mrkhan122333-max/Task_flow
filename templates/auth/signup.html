{% extends "base.html" %}
{% block title %}Sign up - TaskFlow{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-title"><span class="brand-mark">◆</span> TaskFlow</div>
        <div class="auth-subtitle">Create your workspace account</div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" type="text" name="name" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" name="email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm password</label>
                <input class="form-input" type="password" name="confirm_password" required minlength="6">
            </div>
            <button class="btn" type="submit">Create account</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
