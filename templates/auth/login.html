{% extends "base.html" %}
{% block title %}Log in - TaskFlow{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-title"><span class="brand-mark">◆</span> TaskFlow</div>
        <div class="auth-subtitle">Log in to your workspace</div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" required>
            </div>
            <button class="btn" type="submit">Log in</button>
        </form>
        <div class="auth-switch">
            Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
