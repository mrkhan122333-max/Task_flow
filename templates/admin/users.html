{% extends "base.html" %}
{% block title %}People - TaskFlow{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">People</h1>
</div>

<div class="card">
    <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
        <tbody>
        {% for u in users %}
            <tr>
                <td>{{ u.name }}</td>
                <td>{{ u.email }}</td>
                <td><span class="role-badge role-{{ u.role }}">{{ u.role }}</span></td>
                <td>
                    <form class="inline-form" method="POST" action="{{ url_for('main.change_user_role', user_id=u.id) }}" style="display:flex; gap:6px;">
                        <select name="role" class="form-select" style="width:auto; padding:5px 8px;">
                            {% for r in valid_roles %}
                            <option value="{{ r }}" {% if r == u.role %}selected{% endif %}>{{ r|capitalize }}</option>
                            {% endfor %}
                        </select>
                        <button class="btn btn-secondary btn-sm" type="submit">Update</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
